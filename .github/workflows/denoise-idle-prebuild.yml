name: denoise-idle-prebuild
on:
  push:
    branches: ['diag/denoise-idle-prebuild']
permissions:
  contents: read
  actions: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Existing pinned wasm artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41499299117 -n denoise-wasm -D crates/gwar-denoise-wasm/pkg
          gh run download 41499299117 -n mls-wasm -D crates/gwar-mls-wasm/pkg
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/apt-install.sh --playwright chromium webkit firefox
      - run: pnpm --filter web exec playwright install chromium webkit firefox
      - name: Actual model bit identity, persistent handover and lifecycle regressions
        run: nice -n 10 pnpm --filter web test src/voice/denoise src/voice/webrtc-engine.test.ts src/state/controller.test.ts
      - name: Paired main and prebuild, cold/warm joins, main-thread tasks and original quality
        env:
          E2E_BROWSERS: chromium,webkit,firefox
          # The control: current main, which still builds the model on the audio thread.
          CONTROL: d04d51a99a4e37fb4aef9f5ff92e361de7b0dccb
          # Interleaved on one runner; `pr` is this commit's source.
          ORDER: main pr pr main
          SCENARIOS: cold warm
          QUALITY: '1'
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e
          pactl set-default-source e2e.monitor
          mkdir -p "$RUNNER_TEMP/readiness"
          status=0
          for entry in $ORDER; do
            variant=${entry%%=*}
            case "$entry" in
              *=*) ref=${entry#*=} ;;
              main) ref=$CONTROL ;;
              *) ref=${{ github.sha }} ;;
            esac
            git restore --source="$ref" -- apps/web/src
            python3 scripts/ci/denoise-idle-instrument.py
            python3 scripts/ci/denoise-phase-instrument.py
            nice -n 10 pnpm --filter web typecheck
            echo "VARIANT $variant $ref"
            for scenario in $SCENARIOS; do
              echo "SCENARIO $scenario"
              set +e
              E2E_DENOISE_CASE="$scenario" nice -n 10 pnpm --filter web exec node e2e/denoise-join.mjs 2>&1 | tee -a "$RUNNER_TEMP/readiness/$variant-$scenario.log"
              code=${PIPESTATUS[0]}
              set -e
              echo "EXIT $variant $scenario $code"
              if [ "$code" -ne 0 ]; then status=1; fi
            done
            if [ "$QUALITY" != 1 ]; then continue; fi
            echo "SCENARIO quality"
            # Main is the positive control of the audio-thread bound: its trace must show the
            # model build there (e2e/denoise.mjs), while the candidate must stay below it.
            control=; if [ "$variant" = main ]; then control=audio-thread-build; fi
            set +e
            E2E_DENOISE_CONTROL="$control" nice -n 10 pnpm --filter web exec node e2e/denoise.mjs 2>&1 | tee -a "$RUNNER_TEMP/readiness/$variant-quality.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "EXIT $variant quality $code"
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: denoise-idle-prebuild-${{ matrix.n }}
          path: ${{ runner.temp }}/readiness
