      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: denoise-wasm
          path: crates/gwar-denoise-wasm/pkg/
      - name: Native runtime libraries
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh libopus0 libasound2t64 pulseaudio
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Browser system dependencies
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh --playwright chromium
      - name: Install browsers
        timeout-minutes: 5
        run: pnpm --filter web exec playwright install chromium
      - name: Private channels in the browser
        timeout-minutes: 10
        run: |
          pnpm --filter web e2e:private
      - name: Direct messages
        timeout-minutes: 10
        run: pnpm --filter web e2e:dm
      - name: Key archive
        timeout-minutes: 10
        run: pnpm --filter web e2e:archive
      - name: Desktop engine encrypted voice (native engine driven by the web MLS controller)
        timeout-minutes: 15
        run: |
          # Headless Chromium needs an audio output for the browser device's WebAudio tap.
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e
          pnpm --filter web e2e:native-voice

  ci-ok:
    if: ${{ always() }}
    needs: [changes, rust, rust-voice, rust-screen-sim, teamspeak, audit, web, desktop, native-build, mls-wasm, denoise-wasm, browser-mls, browser-smoke, browser-voice, browser-screen, browser-private]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
      - name: Every selected job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check-results.py
        timeout-minutes: 1
