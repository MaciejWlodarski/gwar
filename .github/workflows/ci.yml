      - name: Browser MLS runtime with the local delivery service
        timeout-minutes: 10
        run: |
          pnpm --filter web e2e:mls

  # The smoke suite: text, voice, roles, private channels and Gwar Connect in Chromium.
  browser-smoke:
    needs: [changes, mls-wasm, denoise-wasm, native-build]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
