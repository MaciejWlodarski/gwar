name: ci

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commits: a moved tag cannot change what runs here.
permissions:
  contents: read

# A new push to a pull request replaces its running checks; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Set before every Rust cache lookup; dependency/codec opt-level overrides stay in Cargo.toml.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      native: ${{ steps.paths.outputs.native }}
      app: ${{ steps.paths.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Coverage selection regressions
        run: python3 scripts/ci/test-ci.py
        timeout-minutes: 1
      - name: Select coverage (main always runs everything)
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/changes.py
        timeout-minutes: 1

  rust:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 5
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        timeout-minutes: 5
        with:
          prefix-key: ci-v2-debug0
          cache-bin: false
          shared-key: linux-tests
          # Only this job writes the shared native dependency cache.
          save-if: true
      - name: System libraries (Opus, ALSA)
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh libopus-dev libasound2-dev pkg-config
      - name: Format
        timeout-minutes: 5
        run: cargo fmt --all --check
      - name: Clippy
        timeout-minutes: 20
        run: cargo clippy --workspace --exclude gwar-desktop --all-targets -- -D warnings
      # Cold code generation used nine minutes of the old combined test deadline.
      - name: Build tests
        timeout-minutes: 20
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo test --locked --workspace --exclude gwar-desktop --no-run
      - name: Tests
        timeout-minutes: 15
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo test --locked --workspace --exclude gwar-desktop

      - name: Vendored str0m payload and SDP negotiation regressions
        timeout-minutes: 5
        run: |
          cargo test -j 4 --manifest-path vendor/str0m/Cargo.toml --no-default-features --features aws-lc-rs,_internal_test_exports --lib format::payload_params
          cargo test -j 4 --manifest-path vendor/str0m/Cargo.toml --no-default-features --features aws-lc-rs,_internal_test_exports --test sdp-negotiation

  # The full network matrices run independently of the workspace's 15-minute Tests step.
  # Default server tests retain every scheduler cadence protected by the voice gate.
  rust-screen-sim:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [voice_headroom, startup, recovery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 5
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        timeout-minutes: 5
        with:
          prefix-key: ci-v2-debug0
          cache-bin: false
          shared-key: linux-tests
          save-if: false
      - name: System libraries (Opus, ALSA)
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh libopus-dev libasound2-dev pkg-config
      - name: Build simulations
        timeout-minutes: 20
        run: cargo test -j 4 -p gwar-server --no-default-features --lib --no-run
      - name: Full screen simulation matrix
        timeout-minutes: 15
        run: cargo test -j 4 -p gwar-server --no-default-features --lib media::screen::sim::tests::full_${{ matrix.suite }}_matrix -- --ignored --nocapture

  # Keep whole-workspace feature unification in the native suites. The test command below
  # can later become a shard matrix without changing producers or the aggregate gate.

  # Real-time voice tests that need a runner of their own.
  rust-voice:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 5
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        timeout-minutes: 5
        with:
          prefix-key: ci-v2-debug0
          cache-bin: false
          shared-key: linux-tests
          save-if: false
      - name: System libraries (Opus, ALSA)
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh libopus-dev libasound2-dev pkg-config
      - name: Queued encrypted voice
        timeout-minutes: 15
        run: cargo test --workspace --exclude gwar-desktop --features gwar-server/test-hooks --test mls voice_opaque_srtp
      - name: Eight native SFrame senders, alone (nine real-time engines)
        timeout-minutes: 15
        # Nine devices join one MLS group in a debug build: single frames can take longer than 3 s here.
        env:
          GWAR_TEST_FRAME_TIMEOUT_SECS: "30"
        run: cargo test --workspace --exclude gwar-desktop --features gwar-server/test-hooks --test mls native_sframe_receiver_decodes_eight_senders_on_all_slots -- --ignored
      - name: Server without TeamSpeak support
        timeout-minutes: 20
        run: cargo build -p gwar-server --no-default-features

  # Runs the official TeamSpeak server (downloaded and checksum-verified),
  # one at a time: its free license allows a single instance per host.
  teamspeak:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 5
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        timeout-minutes: 5
        with:
          prefix-key: ci-v2-debug0
          cache-bin: false
          shared-key: linux-tests
          save-if: false
      - name: System libraries (Opus, ALSA)
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh libopus-dev libasound2-dev pkg-config
      - name: Deterministic TeamSpeak hook regressions
        timeout-minutes: 15
        run: cargo test --workspace --exclude gwar-desktop --features gwar-server/test-hooks --lib teamspeak
      - name: TeamSpeak bridge end-to-end
        timeout-minutes: 20
        env:
          GWAR_TS3_DIR: ${{ runner.temp }}/ts3
        run: cargo test --workspace --exclude gwar-desktop --features gwar-server/test-hooks --test teamspeak_mode --test teamspeak_interop -- --test-threads=1
      - name: TeamSpeak channel permissions
        timeout-minutes: 15
        env:
          GWAR_TS3_DIR: ${{ runner.temp }}/ts3
        run: cargo test --workspace --exclude gwar-desktop --features gwar-server/test-hooks --test teamspeak_channels --test teamspeak_import -- --ignored --test-threads=1

  # Known vulnerabilities in dependencies fail the build (advisories only, not
  # "unmaintained" notices). Separate, so the other jobs still report.
  audit:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 5
        with:
          toolchain: stable
      # Only finished tools: no workspace/registry dependency cache for cargo install.
      - name: Audit tool cache
        timeout-minutes: 5
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/ci-audit-tools/bin
          key: audit-tools-v1-${{ runner.os }}-${{ runner.arch }}-audit-0.22.2-about-0.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22
      - name: Install audit tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --root "$HOME/.cargo/ci-audit-tools"
          cargo install cargo-about --version 0.9.2 --locked --features cli --root "$HOME/.cargo/ci-audit-tools"
        timeout-minutes: 12
      - name: Use audit tools
        timeout-minutes: 5
        run: |
          echo "$HOME/.cargo/ci-audit-tools/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/ci-audit-tools/bin/cargo-audit" --version
          "$HOME/.cargo/ci-audit-tools/bin/cargo-about" --version
      - name: Save audit tools
        timeout-minutes: 5
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/ci-audit-tools/bin
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - run: cargo audit
        timeout-minutes: 5
      - name: libcrux-kem stays out of the build (see .cargo/audit.toml)
        timeout-minutes: 5
        run: test -z "$(cargo tree -i libcrux-kem --target all 2>/dev/null)"
      - run: pnpm audit --prod
        timeout-minutes: 5
      - name: Every crate the desktop app ships has an accepted license (scripts/licenses)
        timeout-minutes: 5
        run: |
          cargo about generate --fail --locked --format json -c scripts/licenses/about.toml -m apps/desktop/src-tauri/Cargo.toml > /dev/null
          cargo about generate --fail --locked --format json -c scripts/licenses/about.toml -m crates/gwar-mls-wasm/Cargo.toml --target wasm32-unknown-unknown > /dev/null

  web:
    needs: [changes, mls-wasm, denoise-wasm]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: denoise-wasm
          path: crates/gwar-denoise-wasm/pkg/
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - run: pnpm --filter web lint
        timeout-minutes: 5
      - run: pnpm --filter web test
        timeout-minutes: 5
      - run: pnpm --filter web test:latency
        timeout-minutes: 5
      - run: pnpm --filter web test:screen-startup
        timeout-minutes: 5
      - run: pnpm --filter web build
        timeout-minutes: 5
      - name: Browser system dependencies
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh --playwright chromium webkit firefox
      - name: Install browsers
        timeout-minutes: 5
        run: pnpm --filter web exec playwright install chromium webkit firefox
      - name: Audio libraries
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh pulseaudio
      - run: pnpm --filter web e2e:images
        timeout-minutes: 10
      - name: Message verification storage in Chromium, WebKit and Firefox
        timeout-minutes: 10
        run: pnpm --filter web e2e:verification
        env:
          E2E_BROWSERS: chromium,webkit,firefox
      # Headless browsers need an audio output: Firefox's audio contexts never start without one.
      - name: Sound server with a null sink
        timeout-minutes: 5
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e
      - name: Noise suppression in Chromium, WebKit and Firefox
        timeout-minutes: 10
        run: pnpm --filter web e2e:denoise
        env:
          E2E_BROWSERS: chromium,webkit,firefox
      - name: Input sensitivity, audio-thread gate and responsive settings
        timeout-minutes: 5
        run: pnpm --filter web e2e:input-sensitivity

  desktop:
    needs: [changes, mls-wasm]
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 35
    strategy:
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 5
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        timeout-minutes: 5
        with:
          prefix-key: ci-v2-debug0
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Verify media tests before app setup; include cold dependency compilation and doctests.
      - name: Platform-neutral media tests
        timeout-minutes: 10
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo test --locked -p gwar-media
      - name: Linux libraries
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: bash scripts/ci/apt-install.sh libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libopus-dev libasound2-dev patchelf
      - name: macOS libraries
        timeout-minutes: 8
        if: runner.os == 'macOS'
        run: brew install opus
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      # The bundle the app embeds (tauri.conf.json's beforeBuildCommand).
      - run: pnpm --filter web build:desktop
        timeout-minutes: 5
      # Only built here, never run: unoptimized dependencies build faster.
      - name: Build desktop
        timeout-minutes: 20
        shell: bash
        run: cargo build -p gwar-desktop --config 'profile.dev.package."*".opt-level=0'

  native-build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 5
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        timeout-minutes: 5
        with:
          prefix-key: ci-v2-debug0
          cache-bin: false
          shared-key: linux-tests
          save-if: false
      - name: System libraries (Opus, ALSA)
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh libopus-dev libasound2-dev pkg-config
      - name: Default server, Connect and native bridge
        timeout-minutes: 20
        run: |
          cargo build --locked --workspace --exclude gwar-desktop --bins --example native_bridge
          mkdir -p "$RUNNER_TEMP/native/target/debug/examples"
          cp target/debug/gwar-server target/debug/gwar-connect "$RUNNER_TEMP/native/target/debug/"
          cp target/debug/examples/native_bridge "$RUNNER_TEMP/native/target/debug/examples/"
      - name: Test-hooks server for the watch suite
        timeout-minutes: 20
        run: |
          cargo build --locked -p gwar-server --features test-hooks
          cp target/debug/gwar-server "$RUNNER_TEMP/native/target/debug/gwar-server-test-hooks"
          tar -C "$RUNNER_TEMP/native" -czf "$RUNNER_TEMP/native-browser.tar.gz" target
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: native-browser-binaries
          path: ${{ runner.temp }}/native-browser.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Exact finished-output caches; validation still runs on every hit.
  mls-wasm:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 5
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Exact wasm output key
        timeout-minutes: 5
        id: wasm-key
        run: python3 scripts/ci/wasm-key.py mls
      - name: Restore finished wasm
        timeout-minutes: 5
        id: pkg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/gwar-mls-wasm/pkg/
          key: ${{ steps.wasm-key.outputs.key }}
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Pinned wasm tools
        timeout-minutes: 12
        if: steps.pkg.outputs.cache-hit != 'true'
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          npm install --prefix .build-tools --no-audit --no-fund binaryen@123.0.0
      - name: Build artifact path regression
        timeout-minutes: 5
        run: node scripts/mls-wasm/test-build.mjs
      - name: Build production wasm on cache miss
        timeout-minutes: 15
        if: steps.pkg.outputs.cache-hit != 'true'
        env:
          WASM_OPT: .build-tools/node_modules/.bin/wasm-opt
        run: scripts/mls-wasm/build.sh
      - name: Production wasm gzip budget (also on hits)
        timeout-minutes: 5
        run: node scripts/mls-wasm/size.mjs
      - name: JavaScript agent smoke test
        timeout-minutes: 5
        run: node scripts/mls-wasm/smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
          if-no-files-found: error
          retention-days: 7

      - name: Save validated wasm output
        timeout-minutes: 5
        if: steps.pkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/gwar-mls-wasm/pkg/
          key: ${{ steps.wasm-key.outputs.key }}

  # The web app's noise suppression: its wasm module and the model's archive.
  denoise-wasm:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 5
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22.23.3
      - name: Exact wasm output key
        timeout-minutes: 5
        id: wasm-key
        run: python3 scripts/ci/wasm-key.py denoise
      - name: Restore finished wasm
        timeout-minutes: 5
        id: pkg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/gwar-denoise-wasm/pkg/
          key: ${{ steps.wasm-key.outputs.key }}
      - name: Pinned wasm-opt
        timeout-minutes: 5
        if: steps.pkg.outputs.cache-hit != 'true'
        run: npm install --prefix .build-tools --no-audit --no-fund binaryen@123.0.0
      - name: Build wasm module and pinned model on cache miss
        timeout-minutes: 20
        if: steps.pkg.outputs.cache-hit != 'true'
        env:
          WASM_OPT: .build-tools/node_modules/.bin/wasm-opt
        run: scripts/denoise-wasm/build.sh
      - name: Validate pinned model, imports, noise reduction and real-time budget (also on hits)
        timeout-minutes: 5
        run: node scripts/denoise-wasm/check.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: denoise-wasm
          path: crates/gwar-denoise-wasm/pkg/
          if-no-files-found: error
          retention-days: 7

      - name: Save validated wasm output
        timeout-minutes: 5
        if: steps.pkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
