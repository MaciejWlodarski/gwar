      - name: Restore executable native binaries
        timeout-minutes: 5
        run: tar -xzf "$RUNNER_TEMP/native-browser/native-browser.tar.gz"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: denoise-wasm
          path: crates/gwar-denoise-wasm/pkg/
      - name: Native runtime libraries
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh libopus0 libasound2t64
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Browser system dependencies
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh --playwright chromium
      - name: Install browsers
        timeout-minutes: 5
        run: pnpm --filter web exec playwright install chromium
      - name: Smoke test in the browser
        timeout-minutes: 10
        run: |
          pnpm --filter web e2e:onboarding
          pnpm --filter web e2e

  # Encrypted voice through the SFU with SFrame, in Chromium and WebKit.
  browser-voice:
    needs: [changes, mls-wasm, denoise-wasm, native-build]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: native-browser-binaries
          path: ${{ runner.temp }}/native-browser
      - name: Restore executable native binaries
        timeout-minutes: 5
        run: tar -xzf "$RUNNER_TEMP/native-browser/native-browser.tar.gz"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: denoise-wasm
          path: crates/gwar-denoise-wasm/pkg/
      - name: Native runtime libraries
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh libopus0 libasound2t64 pulseaudio
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Browser system dependencies
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh --playwright chromium webkit
      - name: Install browsers
        timeout-minutes: 5
        run: pnpm --filter web exec playwright install chromium webkit
      - name: Encrypted voice in Chromium and WebKit
        timeout-minutes: 10
        run: |
          # Headless browsers need an audio output for the WebAudio taps.
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e
          pnpm --filter web e2e:voice

  # Plaintext screen sharing through the SFU: a real tab captured in Chromium, a canvas in WebKit,
  # viewers in both engines reading a stamped barcode back from the decoded video; then the
  # TeamSpeak guests' watch page.
  browser-screen:
    needs: [changes, mls-wasm, denoise-wasm, native-build]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: native-browser-binaries
          path: ${{ runner.temp }}/native-browser
      - name: Restore executable native binaries
        timeout-minutes: 5
        run: tar -xzf "$RUNNER_TEMP/native-browser/native-browser.tar.gz"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: denoise-wasm
          path: crates/gwar-denoise-wasm/pkg/
      - name: Native runtime libraries
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh libopus0 libasound2t64 pulseaudio
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Browser system dependencies
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh --playwright chromium webkit
      - name: Install browsers
        timeout-minutes: 5
        run: pnpm --filter web exec playwright install chromium webkit
      - name: Screen sharing in Chromium and WebKit
        timeout-minutes: 10
        run: |
          # Headless browsers need an audio output for voice's WebAudio graph.
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e
          pnpm --filter web e2e:screen
      - name: Fixed 1080p60 H.264 through the SFU in Chromium and WebKit
        timeout-minutes: 10
        env:
          E2E_SCREEN_CANVAS: "1"
          E2E_SCREEN_REQUIRE_H264: "1"
        run: pnpm --filter web e2e:screen
      # TeamSpeak watch links: guest pages in Chromium and WebKit, through the test hooks' stand-in
      # bridge (no TeamSpeak server), including the 150 s heartbeat.
      - name: Watch links for TeamSpeak guests
        timeout-minutes: 8
        env:
          GWAR_SERVER_BIN: ${{ github.workspace }}/target/debug/gwar-server-test-hooks
        run: |
          pnpm --filter web e2e:watch

  # Real tab capture has runner-dependent adaptation/start ordering. Keep this diagnostic
  # out of ci-ok until its Ubuntu repeatability is established; #166's fixed-canvas gate stays.
  # The 4-vCPU runner cannot encode the busy 1080p60 source in software: a settled window the
  # encoder reports as CPU-limited is recorded, not asserted (docs/screen-startup-validation.md).
  browser-screen-startup:
    needs: [changes, mls-wasm, denoise-wasm, native-build]
    if: needs.changes.outputs.app == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: native-browser-binaries
          path: ${{ runner.temp }}/native-browser
      - name: Restore executable native binaries
        timeout-minutes: 5
        run: tar -xzf "$RUNNER_TEMP/native-browser/native-browser.tar.gz"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: denoise-wasm
          path: crates/gwar-denoise-wasm/pkg/
      - name: Native runtime libraries
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh libopus0 libasound2t64 pulseaudio
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Browser system dependencies
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh --playwright chromium
      - name: Install browsers
        timeout-minutes: 5
        run: pnpm --filter web exec playwright install chromium
      - name: Real-tab startup resolution and source cadence (diagnostic, non-required)
        timeout-minutes: 12
        env:
          E2E_STARTUP_RESULTS: ${{ runner.temp }}/screen-startup
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e
          pnpm --filter web e2e:screen-startup
      # A sparse share whose startup estimate a briefly busy uplink held at 1 Mb/s: once the
      # uplink frees, the share must re-probe and recover 1080p (docs/screen-share.md,
      # "Stale estimate probe"). H.264 is asserted; the VP9 fallback is recorded.
      - name: Startup estimate recovery after a briefly busy uplink (diagnostic, non-required)
        if: success() || failure()
        timeout-minutes: 9
        env:
          E2E_STARTUP_RESULTS: ${{ runner.temp }}/screen-startup/released
          E2E_STARTUP_SOURCES: barcode20
          E2E_STARTUP_REPEATS: "2"
          E2E_STARTUP_SECONDS: "50"
          E2E_STARTUP_UPLINK: "1000000"
          E2E_STARTUP_RELEASE: "8"
        run: pnpm --filter web e2e:screen-startup
      - name: Retain startup timelines even on failure
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-startup-timelines
          path: ${{ runner.temp }}/screen-startup/
          if-no-files-found: warn
          retention-days: 7

  browser-private:
    needs: [changes, mls-wasm, denoise-wasm, native-build]
