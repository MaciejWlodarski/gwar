name: ci

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commits: a moved tag cannot change what runs here.
permissions:
  contents: read

# A new push to a pull request replaces its running checks; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      # One dependency cache for every Linux test job, saved by the main test job only
      # (pull requests too: a dependency change would otherwise rebuild everything on each push).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-tests
      - name: System libraries (Opus, ALSA)
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libasound2-dev pkg-config
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude vc-desktop --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude vc-desktop

  # The jobs below select the whole workspace (with vc-server's test hooks) so that dependency
  # features unify as in the rust job and its cached dependencies are reused; `-p` would rebuild them.

  # Real-time voice tests that need a runner of their own.
  rust-voice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      # One dependency cache for every Linux test job, saved by the main test job only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-tests
          save-if: false
      - name: System libraries (Opus, ALSA)
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libasound2-dev pkg-config
      - name: Queued encrypted voice
        run: cargo test --workspace --exclude vc-desktop --features vc-server/test-hooks --test mls voice_opaque_srtp
      - name: Eight native SFrame senders, alone (nine real-time engines)
        # Nine devices join one MLS group in a debug build: single frames can take longer than 3 s here.
        env:
          VC_TEST_FRAME_TIMEOUT_SECS: "30"
        run: cargo test --workspace --exclude vc-desktop --features vc-server/test-hooks --test mls native_sframe_receiver_decodes_eight_senders_on_all_slots -- --ignored
      - name: Server without TeamSpeak support
        run: cargo build -p vc-server --no-default-features

  # Runs the official TeamSpeak server (downloaded and checksum-verified),
  # one at a time: its free license allows a single instance per host.
  teamspeak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      # One dependency cache for every Linux test job, saved by the main test job only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-tests
          save-if: false
      - name: System libraries (Opus, ALSA)
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libasound2-dev pkg-config
      - name: Deterministic TeamSpeak hook regressions
        run: cargo test --workspace --exclude vc-desktop --features vc-server/test-hooks --lib teamspeak
      - name: TeamSpeak bridge end-to-end
        env:
          VC_TS3_DIR: ${{ runner.temp }}/ts3
        run: cargo test --workspace --exclude vc-desktop --features vc-server/test-hooks --test teamspeak_mode --test teamspeak_interop -- --test-threads=1
      - name: TeamSpeak channel permissions
        env:
          VC_TS3_DIR: ${{ runner.temp }}/ts3
        run: cargo test --workspace --exclude vc-desktop --features vc-server/test-hooks --test teamspeak_channels --test teamspeak_import -- --ignored --test-threads=1

  # Known vulnerabilities in dependencies fail the build (advisories only, not
  # "unmaintained" notices). Separate, so the other jobs still report.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      # Keeps the installed cargo-audit between runs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - name: libcrux-kem stays out of the build (see .cargo/audit.toml)
        run: test -z "$(cargo tree -i libcrux-kem --target all 2>/dev/null)"
      - run: pnpm audit --prod

  web:
    needs: mls-wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter web e2e:images

  desktop:
    needs: mls-wasm
    strategy:
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libopus-dev libasound2-dev patchelf
      - name: macOS libraries
        if: runner.os == 'macOS'
        run: brew install opus
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      # Only built here, never run: unoptimized dependencies build faster.
      - name: Build desktop
        shell: bash
        run: cargo build -p vc-desktop --config 'profile.dev.package."*".opt-level=0'

  # Builds the MLS wasm once; the jobs that need it start as soon as it is uploaded.
  # The browser jobs build every workspace binary and example (see above for why).
  mls-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pinned wasm tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          npm install --prefix .build-tools --no-audit --no-fund binaryen@123.0.0
      - name: Build artifact path regression
        run: node scripts/mls-wasm/test-build.mjs
      - name: Production wasm and 500 KB gzip budget
        env:
          WASM_OPT: .build-tools/node_modules/.bin/wasm-opt
        run: scripts/mls-wasm/build.sh
      - name: JavaScript agent smoke test
        run: node scripts/mls-wasm/smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
          if-no-files-found: error
          retention-days: 7

  browser-mls:
    needs: mls-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      # One dependency cache for every Linux test job, saved by the main test job only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-tests
          save-if: false
      - name: System libraries (Opus, ALSA)
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libasound2-dev pkg-config
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
      - run: pnpm install --frozen-lockfile
      - name: Browser MLS runtime with the local delivery service
        run: |
          cargo build --workspace --exclude vc-desktop --bins --examples
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web e2e:mls

  browser-private:
    needs: mls-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      # One dependency cache for every Linux test job, saved by the main test job only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-tests
          save-if: false
      - name: System libraries (Opus, ALSA)
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libasound2-dev pkg-config
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
      - run: pnpm install --frozen-lockfile
      - name: Private channels, direct messages and the key archive in the browser
        run: |
          cargo build --workspace --exclude vc-desktop --bins --examples
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web e2e:private
          pnpm --filter web e2e:dm
          pnpm --filter web e2e:archive
      - name: Desktop engine encrypted voice (native engine driven by the web MLS controller)
        run: |
          sudo apt-get install -y pulseaudio
          # Headless Chromium needs an audio output for the browser device's WebAudio tap.
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e
          pnpm --filter web e2e:native-voice
