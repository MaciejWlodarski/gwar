      - name: Native runtime libraries
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh libopus0 libasound2t64
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Browser system dependencies
        timeout-minutes: 8
        run: bash scripts/ci/apt-install.sh --playwright chromium
      - name: Install browsers
        timeout-minutes: 5
