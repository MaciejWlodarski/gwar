name: release

# Push a tag like v0.2.0 to build the desktop app and the server binaries and
# put them in a DRAFT GitHub release, which is reviewed and published by hand.
# Run it manually (Actions > release > Run workflow) for a dry run: it builds
# everything and keeps the files as workflow artifacts, but creates no release.
# See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Build Opus from the bundled source and link it statically, so neither the
  # server nor the desktop bundles depend on a libopus installed on the host.
  LIBOPUS_NO_PKG: "1"
  LIBOPUS_STATIC: "1"
  # The bundled Opus still declares CMake < 3.5 support, which CMake 4 rejects.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # The tag must equal the version in every manifest. Without a tag (dry run)
  # it only checks that they agree with each other.
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/check-version.sh ${TAG:+"$TAG"}

  mls-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pinned wasm tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          npm install --prefix .build-tools --no-audit --no-fund binaryen@123.0.0
      - name: Build artifact path regression
        run: node scripts/mls-wasm/test-build.mjs
      - name: Production wasm and 500 KB gzip budget
        env:
          WASM_OPT: .build-tools/node_modules/.bin/wasm-opt
        run: scripts/mls-wasm/build.sh
      - name: JavaScript agent smoke test
        run: node scripts/mls-wasm/smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
          if-no-files-found: error
          retention-days: 7

  desktop:
    needs: [check, mls-wasm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            # One universal (arm64 + x86_64) disk image, and the same app for the updater
            # (`app` keeps it after the disk image is made; see "macOS update archive").
            args: --target universal-apple-darwin --bundles app,dmg
            files: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          - name: windows
            os: windows-2022
            args: --bundles nsis,msi
            files: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - name: linux
            # The oldest Ubuntu GitHub offers, so the AppImage and the .deb run
            # on older distributions too (they need at least this glibc).
            os: ubuntu-22.04
            args: --bundles appimage,deb
            files: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: desktop-${{ matrix.name }}
      # The bundle's third-party licenses (scripts/licenses/build.mjs, run by the Tauri build).
      - run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf xdg-utils cmake
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mls-wasm
          path: crates/gwar-mls-wasm/pkg/
      - run: pnpm install --frozen-lockfile

      # Sign and notarize on macOS only when the secrets exist. Tauri reads the
      # variables below from the environment; exporting an empty one would make
      # it try (and fail) to sign, so only non-empty sets are exported.
      - name: macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export_var() { # name: pass it on to the following steps
            { echo "$1<<GWAR_EOF"; printf '%s\n' "${!1}"; echo "GWAR_EOF"; } >> "$GITHUB_ENV"
          }
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do export_var $v; done
            echo "Signing with the Developer ID certificate."
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do export_var $v; done
              echo "Notarizing with the Apple ID."
            else
              echo "::warning::Apple notarization secrets are not set: the app is signed but not notarized."
            fi
          else
            echo "::warning::Apple signing secrets are not set: the macOS app is ad-hoc signed only (Gatekeeper will warn)."
          fi

      # Windows code signing is not wired up (see docs/releasing.md): the
      # installers are unsigned and SmartScreen warns about them.
      - name: Build desktop
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      # The updater installs the macOS app from a tar.gz of it, and the Windows and Linux
      # installers as they are. Tauri's own updater files (bundle > createUpdaterArtifacts)
      # would need the signing key in this job; the sign job signs these files instead.
      - name: macOS update archive
        if: runner.os == 'macOS'
        working-directory: target/universal-apple-darwin/release/bundle/macos
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The app folder alone, without macOS metadata: the updater unpacks it as Gwar.app.
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs -czf "Gwar_${VERSION}_universal.app.tar.gz" Gwar.app
          tar -tzf "Gwar_${VERSION}_universal.app.tar.gz" | head -n 5

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  server:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Native ARM runner (free for public repositories).
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: server-${{ matrix.target }}
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config
      - name: Build
        run: cargo build --release --locked -p gwar-server -p gwar-connect
      - name: Check the binaries
        run: |
          file target/release/gwar-server target/release/gwar-connect
          ldd target/release/gwar-server
          if ldd target/release/gwar-server | grep -q libopus; then
            echo "::error::gwar-server links libopus dynamically"; exit 1
          fi
          # Native runners, so the binaries can run here.
          target/release/gwar-server --version
          target/release/gwar-connect --version
      - name: Package
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="gwar-server-v${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp target/release/gwar-server target/release/gwar-connect LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          strip "dist/$name/gwar-server" "dist/$name/gwar-connect"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          tar -tzf "dist/$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Collects every file, writes SHA256SUMS over all of them and (on a tag)
  # attests their provenance and creates the draft release. One job does all
  # uploads, so parallel builds cannot race to create the release.
  release:
    needs: [check, desktop, server]
    runs-on: ubuntu-24.04
    outputs:
      # What the sign job signs: the draft's files must match this SHA256SUMS.
      sums: ${{ steps.sums.outputs.sha256 }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: built
          # Only the build artifacts (a re-run would also find release-assets),
          # each in its own folder, so duplicates reach the check below.
          pattern: "{desktop-*,server-*}"
      # The artifacts keep the bundle folders (nsis/, msi/, appimage/, deb/...):
      # collect every file into one flat folder, which is what gets checksummed,
      # attested, signed and uploaded, and check that nothing is missing.
      - name: Collect the files
        run: |
          mkdir dist
          files=$(mktemp)
          find built -type f -print0 > "$files"
          while IFS= read -r -d '' f; do
            name=$(basename "$f")
            if [ -e "dist/$name" ]; then echo "::error::Two files are named $name."; exit 1; fi
            cp "$f" "dist/$name"
          done < "$files"
          ls -l dist
          missing=0
          for pattern in '*.dmg' '*.app.tar.gz' '*-setup.exe' '*.msi' '*.AppImage' '*.deb' \
            'gwar-server-*-x86_64-unknown-linux-gnu.tar.gz' 'gwar-server-*-aarch64-unknown-linux-gnu.tar.gz'; do
            if ! compgen -G "dist/$pattern" > /dev/null; then echo "::error::No $pattern was built."; missing=1; fi
          done
          exit "$missing"
      - name: Checksums
        id: sums
        working-directory: dist
        run: |
          sums=$(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs sha256sum)
          printf '%s\n' "$sums" > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check SHA256SUMS
          echo "sha256=$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      # GitHub build provenance: which repository, workflow and commit built each
      # file (`gh attestation verify`, docs/releasing.md).
      - name: Attest provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # A re-run: refresh the files, but never touch a published release.
            if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published; not changing it."; exit 1
            fi
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --draft --verify-tag \
              --title "Gwar $TAG" --generate-notes
          fi

  # Signs SHA256SUMS with the release key (minisign), so a download can be
  # checked against the key in this repository and not only against a
  # checksum file that came with it. It also signs the files the app's updater
  # installs and writes latest.json, the update feed the app reads (from the
  # latest published release). The key lives only in the `release`
  # environment, which accepts `v*` tags and waits for the owner's approval.
  sign:
    if: github.event_name == 'push'
    needs: [check, release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: docs/release-key.pub
          sparse-checkout-cone-mode: false
      # Signs the files on the draft, as the release job uploaded them: its SHA256SUMS, whose hash
      # comes from that job's output, must list exactly them. An artifact uploaded while this job
      # waits for approval (the build jobs can) is never what gets signed.
      - name: Download the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SUMS_SHA256: ${{ needs.release.outputs.sums }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::Release $TAG is already published; not changing it."; exit 1
          fi
          if ! [[ $SUMS_SHA256 =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The release job gave no SHA256SUMS hash."; exit 1
          fi
          mkdir dist
          gh release download "$TAG" --repo "$REPO" --dir dist
          cd dist
          # A re-run finds this job's earlier output on the draft; it is made again below.
          rm -f ./*.minisig latest.json
          echo "$SUMS_SHA256  SHA256SUMS" | sha256sum --check
          sha256sum --check SHA256SUMS
          if ! diff <(cut -d ' ' -f 3- SHA256SUMS | LC_ALL=C sort) \
            <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort); then
            echo "::error::The draft's files differ from the ones SHA256SUMS lists."; exit 1
          fi
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign SHA256SUMS and the updates
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The release environment has no MINISIGN_SECRET_KEY."; exit 1
          fi
          sha256sum --check SHA256SUMS
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m SHA256SUMS -t "gwar $TAG SHA256SUMS"
          # The signature must check against the public key in the repository.
          minisign -V -p ../docs/release-key.pub -m SHA256SUMS

          # The updater's files: "<updater targets> <file>", one file each. The app looks up
          # "<os>-<arch>-<installer>" first, then "<os>-<arch>" (tauri-plugin-updater).
          shopt -s nullglob
          platforms='{}'
          for entry in 'darwin-aarch64,darwin-x86_64 *_universal.app.tar.gz' 'windows-x86_64 *-setup.exe' \
            'windows-x86_64-msi *.msi' 'linux-x86_64 *.AppImage' 'linux-x86_64-deb *.deb'; do
            targets=${entry%% *}
            # shellcheck disable=SC2206 # the pattern is meant to expand
            files=(${entry#* })
            if [ "${#files[@]}" -ne 1 ] || ! [[ ${files[0]} =~ ^[A-Za-z0-9._+-]+$ ]]; then
              echo "::error::Expected one plainly named ${entry#* }, found: ${files[*]}"; exit 1
            fi
            file=${files[0]}
            # The updater requires the version in the trusted comment (requireSignedVersion), so
            # a feed cannot announce an older release's file as a newer version.
            minisign -S -s "$key" -m "$file" -t "$(printf 'timestamp:%s\tfile:%s\tversion:%s' "$(date +%s)" "$file" "$VERSION")"
            minisign -V -p ../docs/release-key.pub -m "$file"
            # Tauri reads the whole .minisig file, in base64.
            signature=$(base64 -w0 "$file.minisig")
            for target in ${targets//,/ }; do
              platforms=$(jq --arg t "$target" --arg url "$RELEASE_URL/download/$TAG/$file" --arg s "$signature" \
                '.[$t] = {url: $url, signature: $s}' <<< "$platforms")
            done
          done
          jq -n --arg v "$VERSION" --arg notes "$RELEASE_URL/tag/$TAG" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" '{version: $v, notes: $notes, pub_date: $date, platforms: $platforms}' > latest.json
          cat latest.json
      - name: Upload the signatures and latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::Release $TAG is already published; not changing it."; exit 1
          fi
          gh release upload "$TAG" dist/*.minisig dist/latest.json --repo "$REPO" --clobber
