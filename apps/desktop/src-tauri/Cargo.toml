[package]
name = "vc-desktop"
version = "0.1.0"
description = "Voice desktop app (Tauri 2) with a native audio engine"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Serve the bundled frontend instead of devUrl; enabled by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vc-client = { path = "../../../crates/vc-client" }
vc-proto = { path = "../../../crates/vc-proto" }
anyhow.workspace = true
rtrb = "0.4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2.5.1"
open = "5.4.4"
