[package]
name = "gwar-desktop"
version = "0.1.2"
description = "Voice desktop app (Tauri 2) with a native audio engine"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gwar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Serve the bundled frontend instead of devUrl; enabled by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
# The WebView2 profile's saved media grants (src/webview.rs); the versions wry uses.
webview2-com = "0.39"
windows = "0.62"
# Already locked through the former autostart implementation.
windows-registry = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS version, for the screen-sharing gate (src/screen.rs); the version wry uses.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSProcessInfo", "NSString", "NSURL"] }

# The Objective-C spelling of statusForLegacyPlist(at:) is statusForLegacyURL:.
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
percent-encoding = "2"
gwar-client = { path = "../../../crates/gwar-client" }
gwar-proto = { path = "../../../crates/gwar-proto" }
anyhow.workspace = true
rtrb = "0.4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2.5.1"
tauri-plugin-dialog = "2"
# Updates: the plain installers are served as they are, so no zip or tar.gz support for Windows and Linux.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
open = "5.4.4"

# Already locked through Tauri; serialize LaunchAgents rather than interpolating XML.
plist = "1.10.1"
tauri-plugin-deep-link = "2"

[dev-dependencies]
base64 = "0.22"
# The updater test runs the plugin in a mock app (src/updates.rs).
tauri = { version = "2", features = ["test"] }
