[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
exclude = ["vendor/tsclientlib", "vendor/str0m"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"

# Debug tests run real-time Opus (several engines at once in the voice tests):
# build the C codec optimized even in the dev profile.
[profile.dev.package.audiopus_sys]
opt-level = 3

# Dependencies (crypto, MLS, codecs) optimized in debug builds and tests; our own crates stay
# unoptimized for debugging. Debug assertions and overflow checks stay on everywhere.
[profile.dev.package."*"]
opt-level = 2

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The noise suppression's wasm runs on the browser's audio thread every 10 ms: built for speed.
[profile.wasm-fast]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
str0m = { path = "vendor/str0m" }

# tsclientlib connects to a download's file transfer itself, where Gwar can
# neither time it out nor cancel it; the patch hands the offer over instead.
# See vendor/tsclientlib/GWAR-PATCH.md.
[patch."https://github.com/ReSpeak/tsclientlib"]
tsclientlib = { path = "vendor/tsclientlib" }
