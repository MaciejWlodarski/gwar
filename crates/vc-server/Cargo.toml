[package]
name = "vc-server"
version = "0.1.0"
description = "Self-hosted voice server core: WebSocket gateway, WebRTC SFU and TeamSpeak compatibility"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["teamspeak"]
# Bridge to the official TeamSpeak server (see src/teamspeak/).
teamspeak = ["dep:tsclientlib", "dep:tsproto-packets", "dep:reqwest", "dep:bzip2", "dep:tar", "dep:zip", "dep:libc"]

[[bin]]
name = "vc-server"
path = "src/main.rs"

[dependencies]
vc-proto = { path = "../vc-proto" }
anyhow.workspace = true
arc-swap = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bzip2 = { version = "0.6", optional = true }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
imagesize = "0.13"
futures = "0.3"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"], optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
thiserror.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["fs", "cors"] }
# HTTPS without a reverse proxy (own certificate or Let's Encrypt).
rustls-acme = { version = "0.15", features = ["axum"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tracing.workspace = true
tracing-subscriber.workspace = true
sha1 = "0.10"
# Puppet clients on the bridged TeamSpeak server.
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", default-features = false, features = ["audio"], optional = true }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }
rcgen = "0.13"
tempfile = "3"
tokio-tungstenite = "0.27"
