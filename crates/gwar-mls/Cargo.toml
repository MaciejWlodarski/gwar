[package]
name = "gwar-mls"
version = "0.1.0"
description = "Gwar's end-to-end encryption rules on top of OpenMLS (docs/e2e-build.md)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gwar-proto = { path = "../gwar-proto" }
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = "2"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
hpke = { package = "hpke-rs", version = "=0.7.0", default-features = false, features = ["hazmat", "serialization"] }
hpke-rs-crypto = "=0.7.0"
hpke-rs-rust-crypto = "=0.7.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
gwar-media = { path = "../gwar-media" }
sframe = "2.1.0"
