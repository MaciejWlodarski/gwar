[package]
name = "gwar-client"
version = "0.1.2"
description = "Native client for the gwar/3 protocol (used by the desktop app)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["deep-filter"]
# The "strong" noise suppression (DeepFilterNet3); without it, "strong" falls back to RNNoise.
deep-filter = ["dep:deep_filter", "dep:ndarray", "dep:tract-core", "dep:tract-data", "dep:tract-hir", "dep:tract-linalg", "dep:tract-nnef", "dep:tract-onnx", "dep:tract-onnx-opl", "dep:tract-pulse", "dep:tract-pulse-opl"]

[dependencies]
url = "2"
gwar-proto = { path = "../gwar-proto", features = ["rtp"] }
anyhow.workspace = true
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
rand = "0.9"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
cpal = { version = "0.18", features = ["realtime"] }
audiopus = "=0.3.0-rc.0"
rtrb = "0.4"
nnnoiseless = { version = "0.5.2", default-features = false }
# DeepFilterNet3, low-latency model (no lookahead), run with tract; only on git (crates.io has 0.2.5 from 2022).
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model-ll"], optional = true }
ndarray = { version = "0.15", optional = true }
# libDF builds against tract 0.21.4 (ndarray 0.15); later 0.21.x moved to ndarray 0.16 and break it.
tract-core = { version = "=0.21.4", optional = true }
tract-data = { version = "=0.21.4", optional = true }
tract-hir = { version = "=0.21.4", optional = true }
tract-linalg = { version = "=0.21.4", optional = true }
tract-nnef = { version = "=0.21.4", optional = true }
tract-onnx = { version = "=0.21.4", optional = true }
tract-onnx-opl = { version = "=0.21.4", optional = true }
tract-pulse = { version = "=0.21.4", optional = true }
tract-pulse-opl = { version = "=0.21.4", optional = true }
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }

sha1 = "0.10"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", default-features = false, features = ["audio", "unstable"] }
tsproto = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
sframe = "2.1.0"
zeroize = "1"

[dev-dependencies]
gwar-server = { path = "../gwar-server" }
reqwest = { version = "0.13", default-features = false }
openmls = "=0.9.1"
openmls_rust_crypto = "=0.6.0"
gwar-mls = { path = "../gwar-mls" }
tracing-subscriber.workspace = true

# Microphone permission (TCC) on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
# Pipeline thread scheduling: thin bindings already in the dependency graph.
libc = "0.2"
mach2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_Threading"]
