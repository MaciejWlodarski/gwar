[package]
name = "gwar-app"
version = "0.1.0"
description = "Shared core of the native Gwar apps (Android first): connection, state and UniFFI bindings"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "gwar_app"
crate-type = ["lib", "cdylib"]

[[bin]]
# Generates the Kotlin bindings from the built library (apps/android/build-rust.sh).
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
anyhow.workspace = true
rtrb = "0.4"
vc-client = { path = "../vc-client" }
vc-proto = { path = "../vc-proto" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uniffi = "0.32"

# AAudio input presets and usages need API level 28 (the app's minSdk).
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }

[dev-dependencies]
vc-server = { path = "../vc-server" }
url = "2"
