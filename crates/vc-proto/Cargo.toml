[package]
name = "vc-proto"
version = "0.1.0"
description = "Wire protocol (vc/3) shared by the server and all clients"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
url = "2"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = "2"
curve25519-dalek = "4"
ts-rs = { version = "12", optional = true }

[features]
# Generates TypeScript bindings into apps/web/src/proto (run `cargo test -p vc-proto --features ts`).
ts = ["dep:ts-rs"]
