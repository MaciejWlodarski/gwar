[package]
name = "vc-client"
version = "0.1.0"
description = "Native client for the vc/3 protocol (used by the desktop app)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
url = "2"
vc-proto = { path = "../vc-proto", features = ["rtp"] }
anyhow.workspace = true
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
rand = "0.9"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
cpal = { version = "0.18", features = ["realtime"] }
audiopus = "=0.3.0-rc.0"
rtrb = "0.4"
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }

sha1 = "0.10"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", default-features = false, features = ["audio", "unstable"] }
tsproto = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
sframe = "2.1.0"
zeroize = "1"

[dev-dependencies]
vc-server = { path = "../vc-server" }
reqwest = { version = "0.13", default-features = false }
openmls = "=0.9.1"
openmls_rust_crypto = "=0.6.0"
gwar-mls = { path = "../gwar-mls" }
tracing-subscriber.workspace = true

# Microphone permission (TCC) on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
# Pipeline thread scheduling: thin bindings already in the dependency graph.
libc = "0.2"
mach2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_Threading"]
