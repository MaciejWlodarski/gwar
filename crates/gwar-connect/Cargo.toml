[package]
name = "gwar-connect"
version = "0.1.1"
description = "Gwar Connect: optional accounts that keep one identity across devices (see docs/connect.md)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gwar-connect"
path = "src/main.rs"

[dependencies]
# Archive manifests and transfers are checked as readers check them (docs/e2e-build.md, section 7).
gwar-mls = { path = "../gwar-mls" }
vc-proto = { path = "../vc-proto" }
anyhow.workspace = true
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
hmac = "0.12"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["cors", "set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
vc-proto = { path = "../vc-proto" }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
aes-gcm = "0.10"
hkdf = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
