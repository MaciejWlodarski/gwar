[package]
name = "gwar-proto"
version = "0.1.2"
description = "Wire protocol (gwar/4) shared by the server and all clients"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
url = "2"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = "2"
curve25519-dalek = "4"
str0m = { version = "0.24", default-features = false, optional = true }
ts-rs = { version = "12", optional = true }

[features]
rtp = ["dep:str0m"]
# Generates TypeScript bindings into apps/web/src/proto (run `cargo test -p gwar-proto --features ts`).
ts = ["dep:ts-rs"]
