[package]
name = "gwar-server"
version = "0.1.2"
description = "Self-hosted voice server core: WebSocket gateway, WebRTC SFU and TeamSpeak compatibility"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["teamspeak"]
# Deterministic admission/forwarding rendezvous for integration regressions only.
test-hooks = []
# Bridge to the official TeamSpeak server (see src/teamspeak/).
teamspeak = ["dep:tsclientlib", "dep:tsproto", "dep:tsproto-packets", "dep:bzip2", "dep:tar", "dep:zip", "dep:libc"]

[[bin]]
name = "gwar-server"
path = "src/main.rs"

[dependencies]
gwar-mls = { path = "../gwar-mls" }
gwar-proto = { path = "../gwar-proto", features = ["rtp"] }
anyhow.workspace = true
arc-swap = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bzip2 = { version = "0.6", optional = true }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
imagesize = "0.13"
futures = "0.3"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
thiserror.workspace = true
tokio.workspace = true
# Direct socket access lets authentication raise the transport limits after join.
tokio-tungstenite = "0.29"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
# HTTPS without a reverse proxy (own certificate or Let's Encrypt).
rustls-acme = { version = "0.15", features = ["axum"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tracing.workspace = true
tracing-subscriber.workspace = true
sha1 = "0.10"
# Puppet clients on the bridged TeamSpeak server.
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", default-features = false, features = ["audio", "unstable"], optional = true }
tsproto = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", optional = true }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", optional = true }
# TeamSpeak public keys and their uids, for claims (docs/teamspeak-import.md); no network code.
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
tar = { version = "0.4", default-features = false, optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
gwar-client = { path = "../gwar-client" }
audiopus = "=0.3.0-rc.0"
rtrb = "0.4"
tokio = { workspace = true, features = ["test-util"] }
gwar-connect = { path = "../gwar-connect" }
reqwest = { version = "0.13", default-features = false }
rcgen = "0.13"
tempfile = "3"
